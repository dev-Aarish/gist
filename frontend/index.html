<!doctype html>
<html lang="en" data-first-paint>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gist — The private, offline-first exam study companion powered by local AI. Study from your own notes with page-exact citations." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gist — Private, Offline Exam Study Companion" />
    <meta property="og:description" content="Ace your exams without giving your notes to the cloud. 100% private, local AI running directly on your machine." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gist — Private, Offline Exam Study Companion" />
    <meta name="twitter:description" content="Ace your exams without giving your notes to the cloud. 100% private, local AI running directly on your machine." />
    <title>Gist — Private, Offline Exam Study Companion</title>
    <script>
      // Applied before React loads so a saved theme never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
