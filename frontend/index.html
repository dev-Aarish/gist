<!doctype html>
<html lang="en" data-first-paint>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Gist — a private, offline study partner that answers from your own notes." />
    <title>Gist — study from your own notes</title>
    <script>
      // Applied before React loads so a saved theme never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
